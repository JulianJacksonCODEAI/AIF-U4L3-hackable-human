<!DOCTYPE html>
<html lang="en" data-mode="phishing">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hackable Human</title>
  <link rel="preload" href="Geist-VariableFont_wght.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Bump ?v= on every release so browsers never mix a new page with an old cached style.css or script.js. -->
  <link rel="stylesheet" href="style.css?v=2026-11-27d">
  <script src="script.js?v=2026-11-27c" defer></script>
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-mail" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 6l10 7 10-7"/></symbol>
    <symbol id="icon-text" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 18h4"/></symbol>
    <symbol id="icon-chat" viewBox="0 0 24 24"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9l-5 4v-4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/></symbol>
    <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/></symbol>
    <symbol id="icon-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="M5 12l4 4L19 6"/></symbol>
    <symbol id="icon-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/><path d="M8.5 12l2.5 2.5 5-5"/></symbol>
    <symbol id="icon-alert" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5"/><circle cx="12" cy="18" r="0.75" fill="currentColor"/></symbol>
    <symbol id="icon-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
    <symbol id="icon-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="icon-spark" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><circle cx="5" cy="6" r="1.8"/><circle cx="19" cy="7" r="1.8"/><circle cx="18" cy="18" r="1.8"/><path d="M6.5 7l3.5 3.5M17.4 7.9l-3.4 2.9M16.7 16.8l-2.9-3"/></symbol>
  </svg>

  <div class="app">
    <header class="topbar">
      <div class="role">
        <button class="back-button" id="back-button" type="button" hidden>
          <svg class="icon" aria-hidden="true"><use href="#icon-back"/></svg>
          <span>Change person</span>
        </button>
        <span class="role-badge">
          <svg class="icon" aria-hidden="true"><use href="#icon-search"/></svg>
          <span>Security Investigator</span>
        </span>
        <p class="status-line" id="status-line"></p>
      </div>
      <div class="header-end">
        <h1 class="screen-title" id="screen-title" tabindex="-1">Hackable Human</h1>
        <div class="meter" id="meter" hidden>
          <span class="meter-label" id="meter-label">Messages checked</span>
          <span class="meter-bar" aria-hidden="true"><span class="meter-fill" id="meter-fill"></span></span>
          <span class="meter-value" id="meter-value">0 of 3</span>
        </div>
      </div>
    </header>
    <main class="main" id="main"></main>
  </div>

  <p class="visually-hidden" id="announcer" aria-live="polite"></p>
  <noscript><p class="no-script">This activity needs JavaScript to run.</p></noscript>
</body>
</html>
